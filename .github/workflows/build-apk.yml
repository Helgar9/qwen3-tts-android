name: Build S23 OpenCL Performance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build S23 OpenCL Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build

      - name: Build OpenCL link-time SDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          SDK="$RUNNER_TEMP/qwen-opencl-sdk"

          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$RUNNER_TEMP/OpenCL-Headers"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git "$RUNNER_TEMP/OpenCL-ICD-Loader"

          cmake \
            -S "$RUNNER_TEMP/OpenCL-ICD-Loader" \
            -B "$RUNNER_TEMP/OpenCL-ICD-Loader-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$RUNNER_TEMP/OpenCL-Headers" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=31 \
            -DANDROID_STL=c++_shared \
            -DENABLE_OPENCL_LAYERS=OFF
          cmake --build "$RUNNER_TEMP/OpenCL-ICD-Loader-build"

          LINK_LIB="$(find "$RUNNER_TEMP/OpenCL-ICD-Loader-build" -name libOpenCL.so -type f | head -n 1)"
          test -n "$LINK_LIB"

          mkdir -p "$SDK/OpenCL-Headers" "$SDK/lib/arm64-v8a"
          cp -R "$RUNNER_TEMP/OpenCL-Headers/CL" "$SDK/OpenCL-Headers/"

          # Link ggml-opencl against libOpenCL.so at build time only.
          # Do NOT package this loader into the APK. On the Galaxy S23, Android
          # resolves DT_NEEDED=libOpenCL.so to Samsung/Qualcomm's system driver,
          # which is exposed by the app's <uses-native-library> manifest entry.
          cp "$LINK_LIB" "$SDK/lib/arm64-v8a/libOpenCL.so"

          readelf -d "$SDK/lib/arm64-v8a/libOpenCL.so" | grep SONAME || true
          ls -lh "$SDK/lib/arm64-v8a"

      - name: Configure OpenCL UI labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path("app/src/main/java/com/qwen/tts/android/MainActivity.kt")
          text = ui.read_text(encoding="utf-8")
          replacements = {
              'BackendOption("auto", "AUTO / Vulkan", QwenEngine.BACKEND_AUTO)':
                  'BackendOption("auto", "AUTO / OpenCL", QwenEngine.BACKEND_AUTO)',
              "GPU / Vulkan acceleration": "GPU / OpenCL acceleration",
              "GPU/Vulkan": "GPU/OpenCL",
              "Vulkan did not become the active backend.": "OpenCL did not become the active backend.",
              "Switch to AUTO / Vulkan": "Switch to AUTO / OpenCL",
              "native Vulkan crashes": "native OpenCL crashes",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          ui.write_text(text, encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build S23 OpenCL optimized release APK
        run: |
          ./gradlew :app:assembleRelease \
            -Pqwen.vulkan=false \
            -Pqwen.opencl=true \
            -Pqwen.openmp=true \
            -Pqwen.opencl.sdkDir="$RUNNER_TEMP/qwen-opencl-sdk" \
            --stacktrace

      - name: Verify OpenCL runtime linkage
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"

          # The APK must contain ggml-opencl but must NOT contain our build-time
          # libOpenCL.so or the old libOpenCLLoader.so workaround.
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|arm64)/.*(OpenCL|qwen|ggml)' || true
          if unzip -l "$APK" | grep -qE 'lib/arm64-v8a/libOpenCL(Loader)?\.so'; then
            echo "ERROR: build-time OpenCL loader was accidentally packaged"
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libggml-opencl.so > "$RUNNER_TEMP/libggml-opencl.so"
          readelf -d "$RUNNER_TEMP/libggml-opencl.so" | tee "$RUNNER_TEMP/ggml-opencl.dynamic.txt"
          grep -q 'Shared library: \[libOpenCL.so\]' "$RUNNER_TEMP/ggml-opencl.dynamic.txt"
          if grep -q 'libOpenCLLoader.so' "$RUNNER_TEMP/ggml-opencl.dynamic.txt"; then
            echo "ERROR: stale libOpenCLLoader dependency remains"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            artifacts/qwen3-tts-s23-opencl-adreno-release.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-s23-opencl-adreno
          path: artifacts/qwen3-tts-s23-opencl-adreno-release.apk
          if-no-files-found: error
