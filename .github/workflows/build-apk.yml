name: Build S23 Performance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build S23 Performance Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev git

          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          cmake \
            -S "$RUNNER_TEMP/SPIRV-Headers" \
            -B "$RUNNER_TEMP/SPIRV-Headers-build" \
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF \
            -DSPIRV_HEADERS_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-install"
          cmake --build "$RUNNER_TEMP/SPIRV-Headers-build"
          cmake --install "$RUNNER_TEMP/SPIRV-Headers-build"

          test -f "$RUNNER_TEMP/spirv-install/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          ls -la "$RUNNER_TEMP/spirv-install/share/cmake/SPIRV-Headers"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build S23 optimized release APK
        run: |
          ./gradlew :app:assembleRelease \
            -Pqwen.vulkan=true \
            -Pqwen.openmp=true \
            -Pqwen.spirvHeadersDir="$RUNNER_TEMP/spirv-install/share/cmake/SPIRV-Headers" \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            artifacts/qwen3-tts-s23-vulkan-openmp-release.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-s23-performance
          path: artifacts/qwen3-tts-s23-vulkan-openmp-release.apk
          if-no-files-found: error
